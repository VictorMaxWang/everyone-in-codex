name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use locked Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          architecture: x64

      - name: Run focused tests
        run: npm test

      - name: Check source and script syntax
        run: npm run check

      - name: Materialize all locked upstream sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/materialize-upstreams.ps1 -Component all
          if (-not $?) { throw 'Locked upstream materialization failed.' }

      - name: Adopt setup-node into repo-local runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nodeRoot = Split-Path -Parent (Get-Command node.exe -ErrorAction Stop).Source
          & ./scripts/bootstrap.ps1 -RepoRoot $PWD -NodeRoot $nodeRoot
          if (-not $?) { throw 'Repo-local toolchain bootstrap failed.' }

      - name: Install locked repo-local Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/setup-local-toolchains.ps1
          if (-not $?) { throw 'Repo-local Rust bootstrap failed.' }

      - name: Build patched CodexHost payload
        run: npm run build:codexhost

      - name: Build and audit portable ZIP
        run: npm run package:win

      - name: Upload reproducible release cohort
        uses: actions/upload-artifact@v4
        with:
          name: everyone-codex-windows-x64
          path: |
            artifacts/everyone-codex-*-windows-x64.zip
            artifacts/everyone-codex-*-source.zip
            artifacts/everyone-codex-*-materialized-source.zip
            artifacts/MANIFEST.sha256
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
